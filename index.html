<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10102b">
<title>Science World</title>
<style>
:root{--bg:#090b1b;--panel:#171936;--panel2:#22264e;--ink:#f7f6ff;--muted:#c0c2df;--line:#393d68;--blue:#687cff;--purple:#bd69f4}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at 12% 0%,#322365 0,transparent 42%),radial-gradient(ellipse at 100% 12%,#1b3869 0,transparent 38%),var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Bengali",sans-serif}
header{max-width:1120px;margin:auto;padding:30px 18px 18px} .eyebrow{font-size:12px;letter-spacing:3px;color:#c4b5fd;font-weight:700}
h1{font-size:clamp(36px,8vw,64px);line-height:1.1;margin:12px 0;background:linear-gradient(90deg,#9fb2ff,#e5a7ff);color:transparent;background-clip:text}
.hero p{max-width:700px;color:var(--muted);line-height:1.85;margin:0}
.search{margin-top:22px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:#11142d;color:white;font-size:16px;outline:none}
main{max-width:1120px;margin:auto;padding:12px 18px 60px} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 22px}
.chip{border:1px solid var(--line);background:#171936;color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
.chip.active{background:linear-gradient(110deg,var(--blue),var(--purple));border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.card{background:linear-gradient(145deg,#1b1e42,#11142d);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 10px 28px #0003;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#858cff}
.art{height:112px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#344ca8,#8147a8)}
.content{padding:16px} .num{font-size:12px;color:#c1aaff;letter-spacing:.6px} h2{font-size:19px;margin:7px 0 8px} .desc{font-size:14px;line-height:1.7;color:var(--muted);margin:0}
.detail{display:none;margin-top:13px;padding:12px;border-radius:12px;background:#0c1027;color:#d9dcf5;font-size:14px;line-height:1.8}
.detail.open{display:block} .openbtn{margin-top:13px;border:0;border-radius:999px;padding:9px 14px;color:white;background:linear-gradient(110deg,var(--blue),var(--purple));font:inherit;cursor:pointer}
footer{text-align:center;color:#9399bd;padding:25px 15px;font-size:13px}
</style>
</head>
<body>
<header>
 <div class="eyebrow">SCIENCE • TECHNOLOGY • DISCOVERY</div>
 <section class="hero">
  <h1>Science World</h1>
  <p>বিজ্ঞানকে জানো, প্রযুক্তিকে বোঝো, কৌতূহলকে কাজে লাগাও। সহজ বাংলায় সাজানো ২৫টি অধ্যায়। ভিডিওগুলো পরের ধাপে যোগ করা হবে।</p>
  <input id="search" class="search" type="search" placeholder="অধ্যায়ের নাম লিখে খুঁজুন...">
 </section>
</header>
<main>
 <nav class="toolbar" id="filters">
  <button class="chip active" data-cat="সব">সব অধ্যায়</button>
  <button class="chip" data-cat="জীববিজ্ঞান">জীববিজ্ঞান</button>
  <button class="chip" data-cat="পদার্থবিজ্ঞান">পদার্থবিজ্ঞান</button>
  <button class="chip" data-cat="মহাকাশ">মহাকাশ</button>
  <button class="chip" data-cat="প্রযুক্তি">প্রযুক্তি</button>
  <button class="chip" data-cat="পরিবেশ">পরিবেশ</button>
 </nav>
 <section class="grid" id="chapters"></section>
</main>
<footer>Science World • শেখার আনন্দ সবার জন্য</footer>
<script>
const chapters=[["মানবদেহের পরিচয়", "জীববিজ্ঞান", "🧍", "মানবদেহের প্রধান অঙ্গ ও তন্ত্রের পরিচয়।"], ["কোষ ও কোষের গঠন", "জীববিজ্ঞান", "🔬", "কোষের অংশ, অঙ্গাণু এবং তাদের কাজ।"], ["রক্ত ও রক্তসঞ্চালন", "জীববিজ্ঞান", "🩸", "হৃদপিণ্ড, রক্ত ও রক্তনালির কাজ।"], ["শ্বাসপ্রশ্বাস", "জীববিজ্ঞান", "🫁", "শ্বাসতন্ত্র ও গ্যাসের আদান-প্রদান।"], ["পরিপাক ও পুষ্টি", "জীববিজ্ঞান", "🥗", "খাদ্য পরিপাক ও পুষ্টি শোষণ।"], ["উদ্ভিদের জীবন", "জীববিজ্ঞান", "🌱", "উদ্ভিদের অংশ, বৃদ্ধি ও সালোকসংশ্লেষণ।"], ["প্রাণীজগৎ ও বাস্তুতন্ত্র", "জীববিজ্ঞান", "🦋", "প্রাণীর বৈচিত্র্য, খাদ্যশৃঙ্খল ও বাস্তুতন্ত্র।"], ["জীবাণু ও স্বাস্থ্য", "জীববিজ্ঞান", "🦠", "অণুজীব, রোগ প্রতিরোধ ও স্বাস্থ্যবিধি।"], ["পদার্থের অবস্থা", "পদার্থবিজ্ঞান", "🧊", "কঠিন, তরল ও গ্যাসীয় পদার্থের বৈশিষ্ট্য।"], ["পরমাণু ও অণু", "পদার্থবিজ্ঞান", "⚛️", "পদার্থের ক্ষুদ্র কণা সম্পর্কে ধারণা।"], ["বল ও গতি", "পদার্থবিজ্ঞান", "🚀", "বল, গতি ও দৈনন্দিন জীবনের উদাহরণ।"], ["আলো ও প্রতিফলন", "পদার্থবিজ্ঞান", "💡", "আলোর গতি, প্রতিফলন ও ছায়া।"], ["শব্দ ও কম্পন", "পদার্থবিজ্ঞান", "🔊", "শব্দের উৎপত্তি, বিস্তার ও কম্পন।"], ["তাপ ও তাপমাত্রা", "পদার্থবিজ্ঞান", "🌡️", "তাপ, তাপমাত্রা ও তাপ সঞ্চালন।"], ["বিদ্যুৎ ও চুম্বকত্ব", "পদার্থবিজ্ঞান", "🧲", "বিদ্যুৎ প্রবাহ, বর্তনী ও চুম্বকের ধারণা।"], ["সৌরজগৎ", "মহাকাশ", "🪐", "সূর্য, গ্রহ, উপগ্রহ ও সৌরজগতের পরিচয়।"], ["পৃথিবী ও চাঁদ", "মহাকাশ", "🌍", "পৃথিবীর ঘূর্ণন, পরিক্রমণ ও চাঁদের দশা।"], ["নক্ষত্র ও গ্যালাক্সি", "মহাকাশ", "🌌", "নক্ষত্র, নীহারিকা ও ছায়াপথের পরিচয়।"], ["মহাকাশ অনুসন্ধান", "মহাকাশ", "🛰️", "মহাকাশযান, কৃত্রিম উপগ্রহ ও অনুসন্ধান।"], ["কম্পিউটারের পরিচয়", "প্রযুক্তি", "💻", "কম্পিউটারের হার্ডওয়্যার ও সফটওয়্যার।"], ["ইন্টারনেট ও ওয়েব", "প্রযুক্তি", "🌐", "ইন্টারনেট, ওয়েবসাইট ও নিরাপদ ব্যবহার।"], ["কৃত্রিম বুদ্ধিমত্তা", "প্রযুক্তি", "🤖", "কৃত্রিম বুদ্ধিমত্তার ধারণা ও ব্যবহার।"], ["রোবট ও অটোমেশন", "প্রযুক্তি", "🦾", "রোবট, সেন্সর ও স্বয়ংক্রিয় প্রযুক্তি।"], ["পরিবেশ ও জলবায়ু", "পরিবেশ", "🌳", "পরিবেশ, দূষণ ও জলবায়ু পরিবর্তন।"], ["নবায়নযোগ্য শক্তি", "পরিবেশ", "☀️", "সৌর, বায়ু ও জলবিদ্যুৎ শক্তির পরিচয়।"]];
const grid=document.getElementById('chapters');
let active='সব';
function render(){
 const term=document.getElementById('search').value.trim().toLowerCase();
 grid.innerHTML='';
 chapters.forEach((c,i)=>{
  if((active==='সব'||c[1]===active)&&(!term||(c[0]+c[1]+c[3]).toLowerCase().includes(term))){
   const card=document.createElement('article');card.className='card';
   card.innerHTML=`<div class="art">${c[2]}</div><div class="content"><div class="num">অধ্যায় ${String(i+1).padStart(2,'0')} · ${c[1]}</div><h2>${c[0]}</h2><p class="desc">${c[3]}</p><button class="openbtn" type="button">অধ্যায় পরিচিতি দেখো</button><div class="detail">এই অধ্যায়ে শেখার বিষয়: ${c[3]}<br>এই অধ্যায়ের বিস্তারিত পাঠ, ছবি ও ভিডিও পরবর্তী ধাপে যোগ করা হবে।</div></div>`;
   card.querySelector('button').addEventListener('click',()=>card.querySelector('.detail').classList.toggle('open'));
   grid.appendChild(card);
  }
 });
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('filters').addEventListener('click',e=>{
 if(e.target.dataset.cat){active=e.target.dataset.cat;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b===e.target));render();}
});
render();
</script>
</body></html>
